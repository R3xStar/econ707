project:
  type: book
  output-dir: docs       # HTML files go to docs/ for GitHub Pages
  resources:
    - slides/
    - .nojekyll
  render:
    - "*.qmd"
    - "!lecture-src/"

book:
  title: "ECON 707/807"
  subtitle: "Econometrics II: Time Series and Forecasting"
  author: "Rex Sitti"
  chapters:
    - part: "Course Information"
      chapters:
        - index.qmd
        - about.qmd
        - sitti.qmd
    - part: "Weekly Modules"
      chapters:
        - week-1.qmd
        - week-2.qmd
        - week-3.qmd
        - week-4.qmd
        - week-5.qmd
        - week-6.qmd
        - week-7.qmd
        - week-8.qmd

format:
  html:
    toc: true
    toc-location: right
    self-contained: false
    link-external-newwindow: true
